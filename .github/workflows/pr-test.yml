name: pr-test

on:
  pull_request_target:
    branches:
      - 1.9.0
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: faiss-das-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: >-
    ${{
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready-hcu'
    }}

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  authorize-pr:
    name: Authorize HCU execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - name: Verify ready-hcu authorization
        id: authorization
        uses: actions/github-script@v7
        with:
          script: |
            const label = "ready-hcu";
            const action = context.payload.action;
            const pullRequest = context.payload.pull_request;
            const labels = pullRequest.labels.map(item => item.name);

            core.setOutput("authorized", "false");

            if ((action === "labeled" || action === "unlabeled") &&
                context.payload.label?.name !== label) {
              if (!labels.includes(label)) {
                core.setFailed(
                  `HCU CI is locked for ${pullRequest.head.sha}. ` +
                  `A trusted maintainer must apply the ${label} label.`
                );
                return;
              }
              core.info(`Ignoring unrelated label: ${context.payload.label?.name}.`);
              return;
            }

            if (action === "unlabeled") {
              core.setFailed(
                `HCU CI authorization was revoked for PR #${pullRequest.number}. ` +
                `A trusted maintainer must apply the ${label} label.`
              );
              return;
            }

            if (action !== "labeled") {
              if (labels.includes(label)) {
                core.info(
                  `PR #${pullRequest.number} remains authorized for ${pullRequest.head.sha}.`
                );
                core.setOutput("authorized", "true");
                return;
              }
              core.setFailed(
                `HCU CI is locked for ${pullRequest.head.sha}. ` +
                `A trusted maintainer must apply the ${label} label.`
              );
              return;
            }

            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const permission = response.data.permission;
            const trusted = new Set(["write", "maintain", "admin"]);
            if (!trusted.has(permission)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              core.setFailed(
                `${context.actor} cannot authorize HCU CI (permission: ${permission}).`
              );
              return;
            }

            core.info(
              `${context.actor} authorized HCU CI for ${pullRequest.head.sha}.`
            );
            core.setOutput("authorized", "true");

  compile:
    name: Build Faiss DAS (${{ matrix.dtk }})
    needs: authorize-pr
    if: >-
      ${{
        needs.authorize-pr.result == 'success' &&
        needs.authorize-pr.outputs.authorized == 'true'
      }}
    runs-on: hygon-build
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: dtk2604
            dtk_version: "2604"
            image: hcu/base/dtk:26.04-rockylinux8.6-py3.10
            dtk_index: nightly/dtk2604/+simple/
            aicc_major: 1.0.0
            torch_version: ""
          - dtk: dtk2610
            dtk_version: "2610"
            image: hcu/base/dtk:26.10-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2610/+simple/
            aicc_major: 2.0.0
            torch_version: ""
          - dtk: dtk2704-torch213
            dtk_version: "2704"
            image: hcu/base/dtk:27.04-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2704/+simple/
            aicc_major: 2.0.0
            torch_version: "2.13.0"
    env:
      ARTIFACT_DIR: /ci_public/faiss-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk }}
    defaults:
      run:
        working-directory: faiss
    container:
      image: ${{ vars.HARBOR_SITE }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: faiss
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Merge approved PR revision locally
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          git checkout --detach "${PR_BASE_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Configure pip
        shell: bash
        env:
          PYPI_INDEX: ${{ env.PYPI_URL }}/open/pypi/+simple/
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
        run: |
          set -euo pipefail
          trusted_host="${PYPI_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          trusted_host="${trusted_host%%:*}"
          mkdir -p ~/.pip
          printf '%s\n' '[global]' "index-url = ${PYPI_INDEX}" \
            "extra-index-url = ${DTK_INDEX}" \
            "trusted-host = ${trusted_host}" > ~/.pip/pip.conf

      - name: Verify DTK and install build dependencies
        shell: bash
        env:
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
          TORCH_VERSION: ${{ matrix.torch_version }}
        run: |
          set -euo pipefail
          test -f /opt/dtk/env.sh
          set +u
          source /opt/dtk/env.sh
          set -u
          hipcc --version
          pip install --no-cache-dir numpy==1.26.4 swig ninja wheel setuptools packaging ciupload
          if [[ -n "${TORCH_VERSION}" ]]; then
            trusted_host="${DTK_INDEX#*://}"
            trusted_host="${trusted_host%%/*}"
            trusted_host="${trusted_host%%:*}"
            python3 -m pip install --no-cache-dir \
              --index-url "${DTK_INDEX}" --trusted-host "${trusted_host}" \
              "torch==${TORCH_VERSION}"
            python3 -c "import torch; print(f'torch={torch.__version__}')"
          fi

      - name: Install AICC
        shell: bash
        env:
          AICC_MAJOR: ${{ matrix.aicc_major }}
          DTK_VARIANT: ${{ matrix.dtk }}
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: |
          set -euo pipefail
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          if [[ "${DTK_VARIANT}" == "dtk2610" || "${DTK_VARIANT}" == "dtk2704-torch213" ]]; then
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}" --dtk-dir /opt/dtk
          else
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}"
          fi

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/dtk/env.sh
          set -u
          : "${AMDGPU_TARGETS:?ERROR: DTK env.sh did not set AMDGPU_TARGETS}"
          echo "Building for GPU targets: ${AMDGPU_TARGETS}"
          bash faiss/gpu/hipify.sh
          clang_runtime_dir="$(find /opt/dtk/dcc/lib/clang -type d -path '*/lib/linux' -print -quit 2>/dev/null || true)"
          [[ -n "${clang_runtime_dir}" ]] || { echo "Clang runtime directory was not found" >&2; exit 1; }
          export LIBRARY_PATH="${clang_runtime_dir}:${LIBRARY_PATH:-}"
          amd_comgr_config="$(find /opt/dtk/ -type f \
            \( -name 'amd_comgr-config.cmake' -o -name 'amd_comgrConfig.cmake' \) \
            -print -quit)"
          [[ -n "${amd_comgr_config}" ]] || {
            echo "amd_comgr CMake configuration was not found under /opt/dtk" >&2
            exit 1
          }
          amd_comgr_dir="$(dirname "${amd_comgr_config}")"
          export CMAKE_PREFIX_PATH="/opt/dtk:${amd_comgr_dir}:${CMAKE_PREFIX_PATH:-}"
          mkl_library=""
          for candidate in \
            /usr/lib/x86_64-linux-gnu/libmkl_rt.so \
            /opt/intel/compilers_and_libraries_2020.4.304/linux/mkl/lib/intel64_lin/libmkl_rt.so; do
            if [[ -f "${candidate}" ]]; then
              mkl_library="${candidate}"
              break
            fi
          done
          if [[ -z "${mkl_library}" ]]; then
            mkl_library="$(find "${MKLROOT:-/opt/intel}" -type f -name libmkl_rt.so -print -quit 2>/dev/null || true)"
          fi
          [[ -n "${mkl_library}" ]] || { echo "libmkl_rt.so was not found" >&2; exit 1; }

          CC=hipcc CXX=hipcc cmake -S . -B build \
            -DFAISS_ENABLE_GPU=ON \
            -DFAISS_ENABLE_ROCM=ON \
            -DFAISS_OPT_LEVEL=avx \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/install" \
            -Damd_comgr_DIR="${amd_comgr_dir}" \
            -DMKL_LIBRARIES="${mkl_library}" \
            -DCMAKE_HIP_ARCHITECTURES="${AMDGPU_TARGETS}"
          cmake --build build --parallel "${MAX_JOBS}"
          cmake --install build
          cd build/faiss/python
          python3 setup.py bdist_wheel

      - name: Build manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/manylinux_repair.sh \
            build/faiss/python/dist build/dist-manylinux build/faiss

      - name: Apply DAS local version to wheel
        shell: bash
        env:
          DTK_VERSION: ${{ matrix.dtk_version }}
          TORCH_VERSION: ${{ matrix.torch_version }}
          GIT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repair_args=(
            --dtk_version "${DTK_VERSION}"
            --git_commit "${GIT_COMMIT:0:6}"
            --outputdir output
          )
          if [[ -n "${TORCH_VERSION}" ]]; then
            repair_args+=(--torch_version "${TORCH_VERSION}")
          fi
          CIUpload REPAIR "${repair_args[@]}" -f build/dist-manylinux/*.whl

      - name: Save build outputs for tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}"
          cp -v output/*.whl "${ARTIFACT_DIR}/"
          tar -czf "${ARTIFACT_DIR}/build.tar.gz" build

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true

  test:
    name: Test Faiss DAS (${{ matrix.dtk }}, 1 card)
    needs: compile
    if: ${{ needs.compile.result == 'success' }}
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: dtk2604
            dtk_version: "2604"
            image: hcu/base/dtk:26.04-rockylinux8.6-py3.10
            dtk_index: nightly/dtk2604/+simple/
            torch_version: ""
          - dtk: dtk2610
            dtk_version: "2610"
            image: hcu/base/dtk:26.10-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2610/+simple/
            torch_version: ""
          - dtk: dtk2704-torch213
            dtk_version: "2704"
            image: hcu/base/dtk:27.04-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2704/+simple/
            torch_version: "2.13.0"
    env:
      ARTIFACT_DIR: /ci_public/faiss-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk }}
    defaults:
      run:
        working-directory: faiss
    container:
      image: ${{ vars.HARBOR_SITE }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: faiss
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Merge PR revision locally
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          git checkout --detach "${PR_BASE_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Configure pip
        shell: bash
        env:
          PYPI_INDEX: ${{ env.PYPI_URL }}/open/pypi/+simple/
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
        run: |
          set -euo pipefail
          trusted_host="${PYPI_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          trusted_host="${trusted_host%%:*}"
          mkdir -p ~/.pip
          printf '%s\n' '[global]' "index-url = ${PYPI_INDEX}" \
            "extra-index-url = ${DTK_INDEX}" \
            "trusted-host = ${trusted_host}" > ~/.pip/pip.conf

      - name: Restore build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "${ARTIFACT_DIR}/build.tar.gz"
          tar -xzf "${ARTIFACT_DIR}/build.tar.gz"
          shopt -s nullglob
          wheels=("${ARTIFACT_DIR}"/*.whl)
          shopt -u nullglob
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one wheel in ${ARTIFACT_DIR}, found ${#wheels[@]}" >&2
            exit 1
          }
          echo "WHEEL_PATH=${wheels[0]}" >> "${GITHUB_ENV}"

      - name: Install and verify manylinux wheel
        shell: bash
        env:
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
          TORCH_VERSION: ${{ matrix.torch_version }}
        run: |
          set -euo pipefail
          test -f /opt/dtk/env.sh
          set +u
          source /opt/dtk/env.sh
          set -u
          python3 -m pip install --no-cache-dir numpy==1.26.4
          if [[ -n "${TORCH_VERSION}" ]]; then
            trusted_host="${DTK_INDEX#*://}"
            trusted_host="${trusted_host%%/*}"
            trusted_host="${trusted_host%%:*}"
            python3 -m pip install --no-cache-dir \
              --index-url "${DTK_INDEX}" --trusted-host "${trusted_host}" \
              "torch==${TORCH_VERSION}"
            EXPECTED_TORCH_VERSION="${TORCH_VERSION}" python3 -c \
              "import os, torch; assert torch.__version__.split('+', 1)[0] == os.environ['EXPECTED_TORCH_VERSION'], torch.__version__"
          fi
          python3 -m pip install --force-reinstall --no-deps "${WHEEL_PATH}"
          python3 -c "import faiss; print(f'tested manylinux wheel: faiss={faiss.__version__}')"

      - name: Run C++ tests
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/dtk/env.sh
          set -u
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/faiss/build/faiss:${LD_LIBRARY_PATH:-}"
          # build.md requires running CTest from the build directory.
          ctest --test-dir build --output-on-failure

      - name: Clean shared outputs
        if: always()
        shell: bash
        run: rm -rf "${ARTIFACT_DIR}" || true

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
