name: pr-test

on:
  pull_request_target:
    branches:
      - 1.9.0
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: faiss-das-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  compile:
    name: Build Faiss DAS (${{ matrix.dtk }})
    runs-on: hygon-build
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: dtk2604
            image: hcu/base/dtk:26.04-rockylinux8.6-py3.10
            dtk_index: nightly/dtk2604/+simple/
            aicc_major: 1.0.0
          - dtk: dtk2610
            image: hcu/base/dtk:26.10-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2610/+simple/
            aicc_major: 2.0.0
    env:
      ARTIFACT_DIR: /ci_public/faiss-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk }}
    defaults:
      run:
        working-directory: faiss
    container:
      image: ${{ vars.HARBOR_SITE }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: faiss
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Merge approved PR revision locally
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          git checkout --detach "${PR_BASE_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Configure pip
        shell: bash
        env:
          PYPI_INDEX: ${{ env.PYPI_URL }}/open/pypi/+simple/
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
        run: |
          set -euo pipefail
          trusted_host="${PYPI_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          trusted_host="${trusted_host%%:*}"
          mkdir -p ~/.pip
          printf '%s\n' '[global]' "index-url = ${PYPI_INDEX}" \
            "extra-index-url = ${DTK_INDEX}" \
            "trusted-host = ${trusted_host}" > ~/.pip/pip.conf

      - name: Verify DTK and install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f /opt/dtk/env.sh
          set +u
          source /opt/dtk/env.sh
          set -u
          hipcc --version
          pip install --no-cache-dir numpy==1.26.4 swig ninja wheel setuptools packaging ciupload

      - name: Install AICC
        shell: bash
        env:
          AICC_MAJOR: ${{ matrix.aicc_major }}
          DTK_VARIANT: ${{ matrix.dtk }}
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: |
          set -euo pipefail
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          if [[ "${DTK_VARIANT}" == "dtk2610" ]]; then
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}" --dtk-dir /opt/dtk
          else
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}"
          fi

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/dtk/env.sh
          set -u
          bash faiss/gpu/hipify.sh
          clang_runtime_dir="$(find /opt/dtk/dcc/lib/clang -type d -path '*/lib/linux' -print -quit 2>/dev/null || true)"
          [[ -n "${clang_runtime_dir}" ]] || { echo "Clang runtime directory was not found" >&2; exit 1; }
          export LIBRARY_PATH="${clang_runtime_dir}:${LIBRARY_PATH:-}"
          amd_comgr_config="$(find /opt/dtk/ -type f \
            \( -name 'amd_comgr-config.cmake' -o -name 'amd_comgrConfig.cmake' \) \
            -print -quit)"
          [[ -n "${amd_comgr_config}" ]] || {
            echo "amd_comgr CMake configuration was not found under /opt/dtk" >&2
            exit 1
          }
          amd_comgr_dir="$(dirname "${amd_comgr_config}")"
          export CMAKE_PREFIX_PATH="/opt/dtk:${amd_comgr_dir}:${CMAKE_PREFIX_PATH:-}"
          mkl_library=""
          for candidate in \
            /usr/lib/x86_64-linux-gnu/libmkl_rt.so \
            /opt/intel/compilers_and_libraries_2020.4.304/linux/mkl/lib/intel64_lin/libmkl_rt.so; do
            if [[ -f "${candidate}" ]]; then
              mkl_library="${candidate}"
              break
            fi
          done
          if [[ -z "${mkl_library}" ]]; then
            mkl_library="$(find "${MKLROOT:-/opt/intel}" -type f -name libmkl_rt.so -print -quit 2>/dev/null || true)"
          fi
          [[ -n "${mkl_library}" ]] || { echo "libmkl_rt.so was not found" >&2; exit 1; }

          CC=hipcc CXX=hipcc cmake -S . -B build \
            -DFAISS_ENABLE_GPU=ON \
            -DFAISS_ENABLE_ROCM=ON \
            -DFAISS_OPT_LEVEL=avx \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/install" \
            -Damd_comgr_DIR="${amd_comgr_dir}" \
            -DMKL_LIBRARIES="${mkl_library}"
          cmake --build build --parallel "${MAX_JOBS}"
          cmake --install build
          cd build/faiss/python
          python3 setup.py bdist_wheel

      - name: Build manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/manylinux_repair.sh \
            build/faiss/python/dist build/dist-manylinux build/faiss

      - name: Apply DAS local version to wheel
        shell: bash
        env:
          GIT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dtk_version="$(tr -d '.[:space:]' < /opt/dtk/.info/rocm_version)"
          CIUpload REPAIR \
            --dtk_version "${dtk_version}" \
            --git_commit "${GIT_COMMIT}" \
            --outputdir output \
            -f build/dist-manylinux/*.whl

      - name: Save build outputs for tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}"
          cp -v output/*.whl "${ARTIFACT_DIR}/"
          tar -czf "${ARTIFACT_DIR}/build.tar.gz" build

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true

  test:
    name: Test Faiss DAS (${{ matrix.dtk }}, 1 card)
    needs: compile
    if: ${{ always() && needs.compile.result != 'cancelled' }}
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: dtk2604
            image: hcu/base/dtk:26.04-rockylinux8.6-py3.10
            dtk_index: nightly/dtk2604/+simple/
          - dtk: dtk2610
            image: hcu/base/dtk:26.10-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2610/+simple/
    env:
      ARTIFACT_DIR: /ci_public/faiss-das/runs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk }}
    defaults:
      run:
        working-directory: faiss
    container:
      image: ${{ vars.HARBOR_SITE }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: faiss
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Merge PR revision locally
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          git checkout --detach "${PR_BASE_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"

      - name: Configure pip
        shell: bash
        env:
          PYPI_INDEX: ${{ env.PYPI_URL }}/open/pypi/+simple/
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
        run: |
          set -euo pipefail
          trusted_host="${PYPI_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          trusted_host="${trusted_host%%:*}"
          mkdir -p ~/.pip
          printf '%s\n' '[global]' "index-url = ${PYPI_INDEX}" \
            "extra-index-url = ${DTK_INDEX}" \
            "trusted-host = ${trusted_host}" > ~/.pip/pip.conf

      - name: Restore build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "${ARTIFACT_DIR}/build.tar.gz"
          tar -xzf "${ARTIFACT_DIR}/build.tar.gz"
          shopt -s nullglob
          wheels=("${ARTIFACT_DIR}"/*.whl)
          shopt -u nullglob
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one wheel in ${ARTIFACT_DIR}, found ${#wheels[@]}" >&2
            exit 1
          }
          echo "WHEEL_PATH=${wheels[0]}" >> "${GITHUB_ENV}"

      - name: Install and verify manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          test -f /opt/dtk/env.sh
          set +u
          source /opt/dtk/env.sh
          set -u
          python3 -m pip install --no-cache-dir numpy==1.26.4
          python3 -m pip install --force-reinstall --no-deps "${WHEEL_PATH}"
          python3 -c "import faiss; print(f'tested manylinux wheel: faiss={faiss.__version__}')"

      - name: Run C++ tests
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/dtk/env.sh
          set -u
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/faiss/build/faiss:${LD_LIBRARY_PATH:-}"
          # build.md requires running CTest from the build directory.
          ctest --test-dir build --output-on-failure

      - name: Clean shared outputs
        if: always()
        shell: bash
        run: rm -rf "${ARTIFACT_DIR}" || true

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
