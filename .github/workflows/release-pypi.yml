name: release-pypi

on:
  push:
    branches:
      - 1.9.0
  # 手动触发只构建和生成 wheel，不上传 nightly。
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  compile:
    name: Build and publish Faiss DAS (${{ matrix.dtk }})
    runs-on: hygon-build
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: dtk2604
            image: hcu/base/dtk:26.04-rockylinux8.6-py3.10
            dtk_index: nightly/dtk2604/+simple/
            dtk_pkg_name: DTK-26.04-rc4-centos8-x86_64.tar.gz
            aicc_major: 1.0.0
          - dtk: dtk2610
            image: hcu/base/dtk:26.10-rockylinux8.6-py3.12
            dtk_index: nightly/dtk2610/+simple/
            dtk_pkg_name: DTK-26.10-CentOS8.5-x86_64.tar.gz
            aicc_major: 2.0.0
    defaults:
      run:
        working-directory: faiss
    container:
      image: ${{ vars.HARBOR_SITE }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: faiss

      - name: Configure pip
        shell: bash
        env:
          PYPI_INDEX: ${{ env.PYPI_URL }}/open/pypi/+simple/
          DTK_INDEX: ${{ env.PYPI_URL }}/${{ matrix.dtk_index }}
        run: |
          set -euo pipefail
          trusted_host="${PYPI_INDEX#*://}"
          trusted_host="${trusted_host%%/*}"
          trusted_host="${trusted_host%%:*}"
          mkdir -p ~/.pip
          printf '%s\n' \
            '[global]' \
            "index-url = ${PYPI_INDEX}" \
            "extra-index-url = ${DTK_INDEX}" \
            "trusted-host = ${trusted_host}" \
            > ~/.pip/pip.conf

      - name: Verify DTK
        shell: bash
        run: |
          set -euo pipefail
          test -f /opt/dtk/env.sh
          set +u
          source /opt/dtk/env.sh
          set -u
          hipcc --version

      - name: Install AICC
        shell: bash
        env:
          AICC_MAJOR: ${{ matrix.aicc_major }}
          DTK_VARIANT: ${{ matrix.dtk }}
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
        run: |
          set -euo pipefail
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          if [[ "${DTK_VARIANT}" == "dtk2610" ]]; then
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}" --dtk-dir /opt/dtk
          else
            bash hcu_llvm_installer.sh --major "${AICC_MAJOR}"
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          pip install --no-cache-dir \
            numpy==1.26.4 swig ninja wheel setuptools packaging ciupload

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/dtk/env.sh
          set -u
          bash faiss/gpu/hipify.sh
          clang_runtime_dir="$(find /opt/dtk/dcc/lib/clang -type d -path '*/lib/linux' -print -quit 2>/dev/null || true)"
          [[ -n "${clang_runtime_dir}" ]] || { echo "Clang runtime directory was not found" >&2; exit 1; }
          export LIBRARY_PATH="${clang_runtime_dir}:${LIBRARY_PATH:-}"
          amd_comgr_config="$(find /opt/dtk/ -type f \
            \( -name 'amd_comgr-config.cmake' -o -name 'amd_comgrConfig.cmake' \) \
            -print -quit)"
          [[ -n "${amd_comgr_config}" ]] || {
            echo "amd_comgr CMake configuration was not found under /opt/dtk" >&2
            exit 1
          }
          amd_comgr_dir="$(dirname "${amd_comgr_config}")"
          export CMAKE_PREFIX_PATH="/opt/dtk:${amd_comgr_dir}:${CMAKE_PREFIX_PATH:-}"

          mkl_library=""
          for candidate in \
            /usr/lib/x86_64-linux-gnu/libmkl_rt.so \
            /opt/intel/compilers_and_libraries_2020.4.304/linux/mkl/lib/intel64_lin/libmkl_rt.so; do
            if [[ -f "${candidate}" ]]; then
              mkl_library="${candidate}"
              break
            fi
          done
          if [[ -z "${mkl_library}" ]]; then
            mkl_library="$(find "${MKLROOT:-/opt/intel}" -type f -name libmkl_rt.so -print -quit 2>/dev/null || true)"
          fi
          [[ -n "${mkl_library}" ]] || { echo "libmkl_rt.so was not found" >&2; exit 1; }
          CC=hipcc CXX=hipcc cmake -S . -B build \
            -DFAISS_ENABLE_GPU=ON \
            -DFAISS_ENABLE_ROCM=ON \
            -DFAISS_OPT_LEVEL=avx \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/install" \
            -Damd_comgr_DIR="${amd_comgr_dir}" \
            -DMKL_LIBRARIES="${mkl_library}"
          cmake --build build --parallel "${MAX_JOBS}"
          cmake --install build
          cd build/faiss/python
          python3 setup.py bdist_wheel

      - name: Apply DAS local version to wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir --no-deps build/faiss/python/dist/*.whl
          bash .github/scripts/manylinux_repair.sh \
            build/faiss/python/dist dist-manylinux build/faiss
          dtk_version="$(tr -d '.[:space:]' < /opt/dtk/.info/rocm_version)"
          CIUpload REPAIR \
            --dtk_version "${dtk_version}" \
            --git_commit "$(git rev-parse HEAD)" \
            --outputdir output \
            -f dist-manylinux/*.whl

      - name: Upload NIGHTLY package
        if: ${{ github.event_name == 'push' }}
        env:
          # CIUpload uses this token to read GitHub metadata for DashHub.
          GITHUB_TOKEN: ${{ github.token }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
          DTK_PKG_NAME: ${{ matrix.dtk_pkg_name }}
        shell: bash
        run: |
          set -euo pipefail
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" \
            --password "${PYPI_PASSWORD}" \
            --dtk_pkg_name "${DTK_PKG_NAME}" \
            --record \
            -f output/*.whl

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
